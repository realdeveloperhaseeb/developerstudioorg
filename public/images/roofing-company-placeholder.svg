<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Roofing placeholder">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#eafaf3"/><stop offset="1" stop-color="#ffffff"/>
 </linearGradient>
 <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#2f3b46"/><stop offset="1" stop-color="#1c2530"/>
 </linearGradient>
 <linearGradient id="roof2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3c4a57"/><stop offset="1" stop-color="#28333d"/>
 </linearGradient>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<circle cx="980" cy="170" r="70" fill="#10b981" opacity="0.18"/>
<circle cx="980" cy="170" r="44" fill="#10b981" opacity="0.30"/>
<!-- back house -->
<g>
 <rect x="560" y="430" width="360" height="300" fill="#eef2f4"/>
 <polygon points="540,440 740,300 940,440" fill="url(#roof2)"/>
 <g stroke="#1b232b" stroke-width="2" opacity="0.5">
  <line x1="575" y1="423" x2="905" y2="423"/><line x1="600" y1="400" x2="880" y2="400"/>
  <line x1="625" y1="377" x2="855" y2="377"/><line x1="650" y1="354" x2="830" y2="354"/>
  <line x1="675" y1="331" x2="805" y2="331"/>
 </g>
 <rect x="845" y="345" width="34" height="70" fill="#28333d"/>
</g>
<!-- front house -->
<g>
 <rect x="180" y="470" width="430" height="260" fill="#f6f8f9"/>
 <polygon points="150,485 395,320 640,485" fill="url(#roof)"/>
 <g stroke="#0f161c" stroke-width="2.5" opacity="0.55">
  <line x1="190" y1="465" x2="600" y2="465"/><line x1="218" y1="438" x2="572" y2="438"/>
  <line x1="246" y1="411" x2="544" y2="411"/><line x1="274" y1="384" x2="516" y2="384"/>
  <line x1="302" y1="357" x2="488" y2="357"/><line x1="330" y1="330" x2="460" y2="330"/>
 </g>
 <!-- windows -->
 <rect x="240" y="540" width="80" height="100" rx="4" fill="#cfe9df"/>
 <rect x="470" y="540" width="80" height="100" rx="4" fill="#cfe9df"/>
 <rect x="360" y="560" width="70" height="170" rx="4" fill="#10b981" opacity="0.85"/>
</g>
<!-- ladder accent -->
<g stroke="#10b981" stroke-width="8" stroke-linecap="round">
 <line x1="650" y1="730" x2="700" y2="486"/><line x1="690" y1="730" x2="740" y2="486"/>
 <line x1="665" y1="660" x2="715" y2="660"/><line x1="672" y1="600" x2="722" y2="600"/><line x1="679" y1="540" x2="729" y2="540"/>
</g>
<rect x="0" y="728" width="1200" height="72" fill="#10b981" opacity="0.10"/>
</svg>